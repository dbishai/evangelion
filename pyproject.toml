[project]
name = "evangelion"
version = "0.1.0"
description = "Coptic Orthodox Gospel lectionary PDF generator, centered on the Coptic liturgical calendar"
readme = "README.md"
authors = [
    { name = "David Bishai", email = "dbishai@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "reportlab>=5.0.1",
    "requests>=2.34.2",
]

[project.scripts]
evangelion = "evangelion:main"
evangelion-seed-offline = "evangelion.seed_offline_db:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "pypdf>=6.18.1",
    "pytest>=8.3.0",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
